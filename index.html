<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrapbook Checklist - Don't Starve Together</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./data/scrapbook_entries.js" defer></script>
    <script src="./js/scripts.js" defer></script>
    <link rel="shortcut icon" href="./favicon.svg" type="image/x-icon" />
  </head>
  <body>
    <main>
      <div class="main">
        <div class="main-container">
          <div class="sorter">
            <div class="title-container">
              <div class="title-margin">
                <h1 class="title">Select an entry</h1>
              </div>
            </div>
            <ul>
              <li class="button-events">
                <button>
                  <img
                    src="./assets/images/scrapbook_ui/sort1.png"
                    alt="Sort button 1"
                  />
                </button>
              </li>
              <li class="button-events">
                <button>
                  <img
                    src="./assets/images/scrapbook_ui/sort2.png"
                    alt="Sort button 2"
                  />
                </button>
              </li>
              <li class="button-events">
                <button>
                  <img
                    src="./assets/images/scrapbook_ui/sort3.png"
                    alt="Sort button 3"
                  />
                </button>
              </li>
              <li class="button-events">
                <button>
                  <img
                    src="./assets/images/scrapbook_ui/sort4.png"
                    alt="Sort button 4"
                  />
                </button>
              </li>
            </ul>
          </div>
          <div class="info-container">
            <div class="divider">
              <img
                src="./assets/images/menu_ui/list_divider_top_middle.png"
                alt=""
              />
              <div>
                <img
                  src="./assets/images/menu_ui/list_divider_top_0.png"
                  alt=""
                />
                <div class="middle"></div>
                <img
                  src="./assets/images/menu_ui/list_divider_top_2.png"
                  alt=""
                />
              </div>
            </div>
            <section>
              <div class="info-header">
                <div class="info">
                  <div class="description">



                  </div>
                </div>
                <div class="group">
                  <button class="close-description"></button>
                  <div class="scrollbar">
                    <button class="arrow"></button>
                    <div class="bar">
                      <div class="handle"></div>
                    </div>
                    <button class="arrow"></button>
                  </div>
                </div>
              </div>
              <div class="info-content-container">
                <div class="info-content">
                  <ul></ul>
                </div>
                <div class="scrollbar">
                  <button class="arrow"></button>
                  <div class="bar">
                    <div class="handle"></div>
                  </div>
                  <button class="arrow"></button>
                </div>
              </div>
            </section>
            <div class="bottom divider">
              <div>
                <img
                  src="./assets/images/menu_ui/list_divider_bottom_0.png"
                  alt=""
                />
                <div class="middle"></div>
                <img
                  src="./assets/images/menu_ui/list_divider_bottom_2.png"
                  alt=""
                />
              </div>
              <img
                src="./assets/images/menu_ui/list_divider_bottom_middle.png"
                alt=""
              />
            </div>
          </div>
        </div>
        <nav class="tabs">
          <ul>
            <li class="button-events">
              <div></div>
              <img src="./assets/images/scrapbook_ui/tab_1.png" alt="" />
              <button>
                <p class="progress subcat" data-partition="creatures"></p>
                Creatures
              </button>
            </li>
            <li class="button-events">
              <div></div>
              <img src="./assets/images/scrapbook_ui/tab_2.png" alt="" />
              <button>
                <p class="progress subcat" data-partition="giants"></p>
                Giants
              </button>
            </li>
            <li class="button-events">
              <div></div>
              <img src="./assets/images/scrapbook_ui/tab_3.png" alt="" />
              <button>
                <p class="progress subcat" data-partition="items"></p>
                Items
              </button>
            </li>
            <li class="button-events">
              <div></div>
              <img src="./assets/images/scrapbook_ui/tab_4.png" alt="" />
              <button>
                <p class="progress subcat" data-partition="food"></p>
                Food
              </button>
            </li>
            <li class="button-events">
              <div></div>
              <img src="./assets/images/scrapbook_ui/tab_5.png" alt="" />
              <button>
                <p class="progress subcat" data-partition="things"></p>
                Things
              </button>
            </li>
            <li class="button-events">
              <div></div>
              <img src="./assets/images/scrapbook_ui/tab_6.png" alt="" />
              <button>
                <p class="progress subcat" data-partition="POI"></p>
                Points of Interest
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </main>
  </body>
</html>
